telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN

security:
  admin_user_ids: []
  whitelisted_user_ids: []

database:
  path: data/db/photo_frame.db

storage:
  incoming_dir: data/incoming
  rendered_dir: data/rendered
  inkypi_payload_dir: data/inkypi
  current_payload_path: data/inkypi/current.json
  current_image_path: data/inkypi/current.png
  keep_recent_rendered: 20

display:
  width: 800
  height: 480
  caption_height: 44
  margin: 18
  metadata_font_size: 14
  caption_font_size: 20
  caption_character_limit: 72
  font_path: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
  text_color: "#111111"
  panel: waveshare                  # waveshare, or file to write data/panel.png instead (testing)
  waveshare_model: epd7in3e         # Waveshare 7.3 inch Spectra 6 (E6)
  driver_dir: vendor/waveshare_epd  # downloaded by scripts/install.sh and scripts/update.sh
  clear_before_display: true        # wipe to white first: no ghosting, twice as slow; /settings overrides
  refresh_timeout_seconds: 300      # stop a refresh that hangs (e.g. a loose cable)
